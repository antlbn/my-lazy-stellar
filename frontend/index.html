<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lazy Stellar · 8-bit UI</title>
  <style>
    :root {
      --bg: #0b0c12;
      --panel: #121622;
      --panel-2: #0f121c;
      --stroke: #e5e5e5;
      --text: #f5f5f5;
      --muted: #9ea4b5;
      --accent: #d9ffe7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #101522 0, transparent 35%),
        radial-gradient(circle at 80% 10%, #121a2f 0, transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: "Press Start 2P", "VT323", "Courier New", monospace;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      image-rendering: pixelated;
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    .shell {
      width: min(960px, 100%);
      background: linear-gradient(145deg, var(--panel), var(--panel-2));
      border: 3px solid var(--stroke);
      box-shadow:
        0 0 0 4px #000,
        0 0 0 8px var(--stroke),
        0 16px 24px rgba(0, 0, 0, 0.55);
      padding: 18px;
      position: relative;
      z-index: 1;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
      text-transform: uppercase;
      font-size: 14px;
    }

    .pixel-icon {
      width: 14px;
      height: 14px;
      background: var(--stroke);
      box-shadow:
        14px 0 var(--stroke),
        -14px 0 var(--stroke),
        0 14px var(--stroke),
        0 -14px var(--stroke),
        14px 14px var(--stroke),
        -14px -14px var(--stroke),
        -14px 14px var(--stroke),
        14px -14px var(--stroke);
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.3));
    }

    .subtitle {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
    }

    .window {
      border: 2px solid var(--stroke);
      background: #06080f;
      padding: 12px;
      min-height: 320px;
      max-height: 460px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      border: 2px solid var(--stroke);
      padding: 10px;
      background: rgba(255, 255, 255, 0.02);
      line-height: 1.6;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .message.user {
      border-color: #9ba0b0;
      background: rgba(255, 255, 255, 0.05);
    }

    .tag {
      display: inline-block;
      padding: 3px 6px;
      border: 2px solid var(--stroke);
      margin-right: 8px;
      background: #000;
      font-size: 11px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .field {
      flex: 1;
      border: 2px solid var(--stroke);
      background: #05060d;
      color: var(--text);
      padding: 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      box-shadow: inset 0 0 0 2px #000;
    }

    .btn {
      border: 2px solid var(--stroke);
      background: #0d121f;
      color: var(--text);
      padding: 12px 16px;
      font-family: inherit;
      font-size: 13px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow:
        inset 0 0 0 2px #000,
        0 0 0 2px var(--stroke);
      transition: transform 80ms ease;
    }

    .btn:active {
      transform: translateY(2px);
    }

    .status {
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .footer {
      margin-top: 12px;
      color: var(--muted);
      font-size: 11px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .pixel-divider {
      height: 2px;
      background: repeating-linear-gradient(
        90deg,
        var(--stroke),
        var(--stroke) 8px,
        transparent 8px,
        transparent 12px
      );
      margin: 10px 0;
    }

    @media (max-width: 720px) {
      .shell { padding: 14px; }
      .header { flex-direction: column; align-items: flex-start; }
      .input-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>
  <div class="shell">
    <div class="header">
      <div class="pixel-icon" aria-hidden="true"></div>
      <div>
        <div>Lazy Stellar · Astro 8-bit</div>
        <div class="subtitle">Минимальный черно-белый интерфейс для вашего агента</div>
      </div>
    </div>

    <div class="pixel-divider"></div>

    <div class="window" id="log"></div>

    <div class="input-row">
      <input
        id="prompt"
        class="field"
        type="text"
        placeholder="Напишите вопрос — где посмотреть звезды?"
        aria-label="Ваш запрос"
      />
      <button class="btn" id="send-btn">Send</button>
    </div>
    <div class="status" id="status">Session: …</div>

    <div class="footer">
      <span class="tag">API</span>
      <span>POST /chat</span>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:8501";
    const APP_NAME = "app";
    const USER_ID = "web";

    const logEl = document.getElementById("log");
    const statusEl = document.getElementById("status");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send-btn");

    let sessionId = null;
    let busy = false;

    function addMessage(author, text) {
      const row = document.createElement("div");
      row.className = "message " + (author === "user" ? "user" : "bot");
      row.innerHTML = `<span class="tag">${author}</span>${text}`;
      logEl.appendChild(row);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function flattenEvents(events) {
      if (!Array.isArray(events)) return "";
      for (let i = events.length - 1; i >= 0; i--) {
        const evt = events[i];
        if (!evt || !evt.content || !evt.content.parts) continue;
        const textParts = evt.content.parts
          .map(p => p.text)
          .filter(Boolean);
        if (textParts.length) {
          return textParts.join("\\n");
        }
      }
      return "";
    }

    function ensureSession() {
      if (!sessionId) {
        sessionId = crypto.randomUUID();
        statusEl.textContent = `Session: ${sessionId}`;
      }
    }

    async function sendMessage() {
      if (busy) return;
      const text = promptEl.value.trim();
      if (!text) return;
      if (!sessionId) {
        await ensureSession();
      }

      addMessage("user", text);
      promptEl.value = "";
      busy = true;
      sendBtn.disabled = true;
      statusEl.textContent = "… отправка";

      try {
        const payload = {
          session_id: sessionId,
          message: text
        };

        const resp = await fetch(`${API_BASE}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!resp.ok) {
          const errorText = await resp.text();
          throw new Error(errorText || resp.statusText);
        }

        const data = await resp.json();
        const reply = data.response || "[пустой ответ]";
        addMessage("agent", reply);
        statusEl.textContent = `Session: ${sessionId}`;
      } catch (err) {
        console.error(err);
        addMessage("agent", "⚠️ Ошибка: " + err.message);
        statusEl.textContent = "Ошибка запроса";
      } finally {
        busy = false;
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    promptEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
      }
    });

    ensureSession();
  </script>
</body>
</html>
